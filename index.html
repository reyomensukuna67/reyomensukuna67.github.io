<!DOCTYPE html>
<html>
<head>
<title>Game Hub</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🎮 Game Hub</h1>

<div id="menu">
<button onclick="show('games')">Games</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('shop')">Shop</button>
<button onclick="show('leaderboard')">Leaderboard</button>
</div>

<h2 id="coins">Coins: 0</h2>

<!-- 🎮 GAMES -->
<div id="games" class="page">
<button onclick="startGame()">Start Game</button>
<canvas id="game" width="300" height="300"></canvas>
</div>

<!-- 🧑 PROFILE -->
<div id="profile" class="page">
<h3>Choose Avatar</h3>
<img src="https://via.placeholder.com/50" onclick="setAvatar(this.src)">
<img src="https://via.placeholder.com/50/ff0000" onclick="setAvatar(this.src)">
<br><br>
<img id="avatar" width="80">
</div>

<!-- 🛒 SHOP -->
<div id="shop" class="page">
<h3>Shop</h3>
<button onclick="buy(50)">Buy Skin (50 coins)</button>
</div>

<!-- 🏆 LEADERBOARD -->
<div id="leaderboard" class="page">
<h3>Leaderboard</h3>
<ul id="board"></ul>
</div>

<!-- 🎧 MUSIC -->
<h3>🎧 Music</h3>
<select onchange="changeMusic(this.value)">
<option value="">None</option>
<option value="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3">Track 1</option>
<option value="https://cdn.pixabay.com/download/audio/2022/10/25/audio_946f.mp3">Track 2</option>
</select>

<audio id="music" loop></audio>

<script src="script.js"></script>
</body>
</html>
