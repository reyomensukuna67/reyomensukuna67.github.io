<!DOCTYPE html>
<html>
<head>
<title>Game Hub</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- MENU -->
<div id="menu" class="menu">
  <h1 class="title">🎮 GAME HUB</h1>
  <button onclick="openGames()">PLAY</button>
</div>

<!-- GAME SELECT -->
<div id="gameSelect" class="menu hidden">
  <button onclick="startSnake()">🐍 Snake</button>
  <button onclick="startGuess()">🧠 Guess</button>
</div>

<!-- 🐍 SNAKE -->
<div id="snakePage" class="hidden center">
  <div>
    <button onclick="goBack()">⬅ BACK</button>
    <h3 id="score">Score: 0</h3>
    <h3 id="time">Time: 0s</h3>
    <canvas id="game" width="400" height="400"></canvas>
  </div>
</div>

<!-- 🧠 GUESS -->
<div id="guessPage" class="hidden center">
  <div>
    <button onclick="goBack()">⬅ BACK</button>
    <h2>Guess 0–20</h2>
    <input id="guessInput">
    <button onclick="checkGuess()">Guess</button>
    <p id="result"></p>
    <p id="attempts">Attempts: 0</p>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameOver" class="hidden overlay fade">
  <div class="box">
    <h1>GAME OVER</h1>
    <p id="finalScore"></p>
    <p id="finalTime"></p>
    <button onclick="restartGame()">🔁 Restart</button>
    <button onclick="goBack()">⬅ Menu</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
